# Statespace settings for the shop.
# Reference: https://docs.statespace.com/reference/statespace-toml
#
# Two apps run from this folder: sandbox and sandbox-dev.
# The shared events and metrics apply to every experiment.

# A visitor buys an item.
[[event]]
name = "buy"
match = '''
request.method == "POST"
  && request.path == "/buy"
  && request.status < 300
'''

# The shop prints {"event": "purchase", ...} on stdout.
[[event]]
name = "purchase_line"
match = 'stdout.json.event == "purchase"'

# The headline in the commit status: the first metric.
[[metric]]
label = "buy rate %"
value = '100.0 * events["buy"].subjects / subjects'

[[metric]]
label = "purchases per 100 requests"
value = '100.0 * events["purchase_line"].lines / requests'

# The experiment "price" compares commits with a different
# PRICE in app.py. Each visitor is a subject (the cookie
# ssp_sid). The arms together get at most 20% of visitors.
[experiment.price]
max_share = 0.2

# The development copy. Every visitor can be in an arm, and
# testers can open an arm with ?ssp_arm=price:<commit>.
[app.sandbox-dev]
overrides = true

[app.sandbox-dev.experiment.price]
max_share = 1.0
