# Publish each commit of an exp/ branch as a version of its arm.
name: Statespace
on:
  push:
    branches: ["exp/**"]
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  arm:
    runs-on: ubuntu-latest
    env:
      STATESPACE_URL: ${{ vars.STATESPACE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          push: true
          tags: ghcr.io/statespace-tech/sandbox:${{ github.sha }}
      # Until statespace 0.2.0 is released, build ssp from its main branch.
      - run: cargo install --locked --git https://github.com/statespace-tech/statespace statespace
      - uses: statespace-tech/action@main
        with:
          image: ghcr.io/statespace-tech/sandbox@${{ steps.build.outputs.digest }}
