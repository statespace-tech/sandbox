# Branch protection on main requires this check, so a pull request can merge,
# and its arm can run, only while the test passes.
name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 test.py
