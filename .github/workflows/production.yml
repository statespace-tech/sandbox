# Build the default from main and record it. Proxies that run it make its
# commit a base for arms.
name: Production
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          push: true
          tags: |
            ghcr.io/statespace-tech/sandbox:${{ github.sha }}
            ghcr.io/statespace-tech/sandbox:main
      - uses: statespace-tech/action@v1
        with:
          image: ghcr.io/statespace-tech/sandbox@${{ steps.build.outputs.digest }}
