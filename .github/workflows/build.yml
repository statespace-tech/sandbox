# Build every push to every branch, and record the build with Statespace.
# Any recorded commit can become an arm: ssp arm add <commit> --app sandbox
name: Build
on:
  push:
    branches: ["**"]
permissions:
  contents: read
  packages: write
  # The Statespace action proves the repo and the commit with OIDC.
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 test.py
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          push: true
          tags: ghcr.io/statespace-tech/sandbox:${{ github.sha }}
      # Record "commit -> image digest" after the build.
      - uses: statespace-tech/action@v1
        with:
          image: >-
            ghcr.io/statespace-tech/sandbox@${{ steps.build.outputs.digest }}
          path: .
